name: Build Image - Fedora Gaokun3

on:
  workflow_dispatch:
    inputs:
      fedora_release:
        description: Fedora release version (e.g. 44, 43)
        required: true
        default: "44"
      kernel_tag:
        description: Linux kernel tag
        required: true
        default: "v7.2.5"
      desktop_environment:
        description: Desktop environment group (e.g. @gnome-desktop @workstation-product)
        required: true
        default: "@gnome-desktop @workstation-product"
      excluded_packages:
        description: Packages to exclude from installation (comma-separated)
        required: true
        default: "open-vm-tools,spice-vdagent, hyperv*"
      extra_packages:
        description: Extra packages to install (space-separated)
        required: true
        default: "google-noto-sans-cjk-tc-fonts google-noto-sans-cjk-sc-fonts google-noto-sans-cjk-jp-fonts google-noto-sans-cjk-kr-fonts google-noto-serif-cjk-fonts ibus-libpinyin nano mpv ripgrep git htop curl wget NetworkManager-wifi cloud-utils-growroot microcode-fedora ipw2100-firmware* ipw2200-firmware* fedora-release-ostree"
      build_el2:
        description: Build and include optional -gaokun3-el2 kernel and EL2 EFI payloads
        required: true
        default: false
        type: boolean
      rebuild_package_rpms:
        description: Rebuild gaokun package RPMs before image build
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-package-rpms:
    if: ${{ github.event.inputs.rebuild_package_rpms == 'true' }}
    uses: ./.github/workflows/gaokun3-package-rpms.yml
    with:
      kernel_tag: ${{ github.event.inputs.kernel_tag }}
      build_el2: ${{ github.event.inputs.build_el2 == 'true' }}
    secrets: inherit

  build-and-release:
    needs: build-package-rpms
    if: ${{ !cancelled() && (needs.build-package-rpms.result == 'success' || needs.build-package-rpms.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    env:
      TZ: UTC
      FEDORA_RELEASE: ${{ github.event.inputs.fedora_release }}
      KERNEL_TAG: ${{ github.event.inputs.kernel_tag }}
      DESKTOP_ENVIRONMENT: ${{ github.event.inputs.desktop_environment }}
      EXCLUDED_PACKAGES: ${{ github.event.inputs.excluded_packages }}
      EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
      BUILD_EL2: ${{ github.event.inputs.build_el2 }}
      IMAGE_SIZE: 12G # 兜底值；实际由 "Compute image size" 步骤按 rootfs 用量动态覆盖
      IMAGE_CHUNK_SIZE: 1900M
      ZSTD_LEVEL: 15 # -19 极慢；-15 压缩率基本持平，速度快约一倍
      GAOKUN_DIR: ${{ github.workspace }}
      WORKDIR: ${{ github.workspace }}/build-fedora
      ROOTFS_DIR: ${{ github.workspace }}/build-fedora/rootfs
      ARTIFACT_DIR: ${{ github.workspace }}/build-fedora/artifacts
      PACKAGE_RPMS_DIR: ${{ github.workspace }}/build-fedora/package-rpms
      IMAGE_FILE: ${{ github.workspace }}/build-fedora/fedora-${{ github.event.inputs.fedora_release }}-gaokun3.img

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            docker.io parted dosfstools e2fsprogs \
            rsync kmod curl jq zstd xz-utils python3

      # 解析包发布 tag（未随本次运行重建时）并下载 manifest + RPM
      - name: Fetch gaokun package RPMs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p "$WORKDIR" "$ROOTFS_DIR" "$ARTIFACT_DIR" "$PACKAGE_RPMS_DIR"

          # GitHub API 认证 GET
          api() {
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$@"
          }

          # 按附件名从 release JSON 解析下载地址并下载，缺失即失败
          download_asset() {
            local name="$1"
            local out="$2"
            local url
            url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .url' "$release_json")"
            if [[ -z "$url" || "$url" == "null" ]]; then
              echo "missing asset ${name} in release ${PACKAGE_RELEASE_TAG}" >&2
              exit 1
            fi
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "$url" -o "$out"
          }

          if [[ "${{ github.event.inputs.rebuild_package_rpms }}" != "true" ]]; then
            # 未重建：按 kernel tag + profile 前缀取最近一次包发布
            safe_kernel_tag="${KERNEL_TAG//\//-}"
            safe_kernel_tag="${safe_kernel_tag//[^A-Za-z0-9._-]/-}"
            profile="std"
            [[ "$BUILD_EL2" == "true" ]] && profile="std-el2"
            prefix="gaokun3-rpms-${safe_kernel_tag}-${profile}-"

            releases_json="$WORKDIR/releases.json"
            api "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" -o "$releases_json"

            PACKAGE_RELEASE_TAG="$(jq -r --arg prefix "$prefix" '.[] | select(.tag_name | startswith($prefix)) | .tag_name' "$releases_json" | head -n 1)"
            if [[ -z "$PACKAGE_RELEASE_TAG" ]]; then
              echo "no package release found for prefix ${prefix}" >&2
              exit 1
            fi
          else
            # 本次已重建：直接用上游 job 产出的 tag
            PACKAGE_RELEASE_TAG="${{ needs.build-package-rpms.outputs.package_release_tag }}"
          fi

          release_json="$WORKDIR/package-release.json"
          api "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${PACKAGE_RELEASE_TAG}" -o "$release_json"

          manifest_path="$PACKAGE_RPMS_DIR/package-manifest.json"
          download_asset package-manifest.json "$manifest_path"

          manifest_kernel_tag="$(jq -r '.kernel_tag' "$manifest_path")"
          if [[ "$manifest_kernel_tag" != "$KERNEL_TAG" ]]; then
            echo "package release kernel tag mismatch: expected ${KERNEL_TAG}, got ${manifest_kernel_tag}" >&2
            exit 1
          fi
          if [[ "$BUILD_EL2" == "true" && "$(jq -r '.build_el2' "$manifest_path")" != "true" ]]; then
            echo "package release ${PACKAGE_RELEASE_TAG} does not contain EL2 packages" >&2
            exit 1
          fi

          rpm_jq_paths=(
            '.kernels.standard.packages.kernel'
            '.kernels.standard.packages.kernel_modules'
            '.packages.firmware'
          )
          [[ "$BUILD_EL2" == "true" ]] && rpm_jq_paths+=('.kernels.el2.packages.kernel' '.kernels.el2.packages.kernel_modules')

          for jq_path in "${rpm_jq_paths[@]}"; do
            rpm_name="$(jq -r "$jq_path" "$manifest_path")"
            download_asset "$rpm_name" "$PACKAGE_RPMS_DIR/$rpm_name"
          done

      - name: Bootstrap Fedora rootfs
        run: |
          set -euxo pipefail
          # 交互变量通过 --env 传入容器（VAR=value 形式不受 sudo 重置环境影响），
          # 避免在单引号脚本里做引号拼接
          sudo docker run --rm \
            --env ROOTFS_DIR="$ROOTFS_DIR" \
            --env FEDORA_RELEASE="$FEDORA_RELEASE" \
            --env DESKTOP_ENVIRONMENT="$DESKTOP_ENVIRONMENT" \
            --env EXCLUDED_PACKAGES="$EXCLUDED_PACKAGES" \
            --env EXTRA_PACKAGES="$EXTRA_PACKAGES" \
            -v "$(dirname "$ROOTFS_DIR")":"$(dirname "$ROOTFS_DIR")" \
            --user root \
            "fedora:${FEDORA_RELEASE}" \
            bash -euxo pipefail -c '
              echo "%_install_langs all" > /etc/rpm/macros.image-language-conf
              sed -i "/tsflags=nodocs/d" /etc/dnf/dnf.conf

              mkdir -p "$ROOTFS_DIR/etc"

              # dconf 供后续镜像配置步骤使用（dconf update 把屏幕键盘等默认值写入数据库）
              dnf -y --installroot="$ROOTFS_DIR" --releasever="$FEDORA_RELEASE" --forcearch=aarch64 --use-host-config \
                --exclude="$EXCLUDED_PACKAGES" \
                install \
                @core @standard "$DESKTOP_ENVIRONMENT" \
                systemd-boot-unsigned alsa-ucm \
                langpacks-en langpacks-zh_CN \
                google-noto-color-emoji-fonts google-noto-emoji-fonts \
                alsa-utils pipewire-utils dconf \
                $EXTRA_PACKAGES

              dnf -y --installroot="$ROOTFS_DIR" --releasever="$FEDORA_RELEASE" --forcearch=aarch64 --use-host-config \
                install \
                "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-${FEDORA_RELEASE}.noarch.rpm"

              mkdir -p /etc/pki/rpm-gpg
              cp -a "$ROOTFS_DIR/etc/pki/rpm-gpg/." /etc/pki/rpm-gpg/

              dnf -y --installroot="$ROOTFS_DIR" --releasever="$FEDORA_RELEASE" --forcearch=aarch64 --use-host-config \
                --setopt=reposdir="$ROOTFS_DIR/etc/yum.repos.d,/etc/yum.repos.d" \
                install \
                libavcodec-freeworld
            '

      - name: Install gaokun package RPMs into rootfs
        run: |
          set -euxo pipefail
          manifest_path="$PACKAGE_RPMS_DIR/package-manifest.json"

          kernel_release="$(jq -r '.kernels.standard.release' "$manifest_path")"
          echo "$kernel_release" > "$WORKDIR/kernel-release.txt"

          el2_kernel_release=""
          if [[ "$BUILD_EL2" == "true" ]]; then
            el2_kernel_release="$(jq -r '.kernels.el2.release' "$manifest_path")"
            echo "$el2_kernel_release" > "$WORKDIR/kernel-release-el2.txt"
          else
            rm -f "$WORKDIR/kernel-release-el2.txt"
          fi

          rpm_files=(
            "$PACKAGE_RPMS_DIR/$(jq -r '.kernels.standard.packages.kernel' "$manifest_path")"
            "$PACKAGE_RPMS_DIR/$(jq -r '.kernels.standard.packages.kernel_modules' "$manifest_path")"
            "$PACKAGE_RPMS_DIR/$(jq -r '.packages.firmware' "$manifest_path")"
          )
          if [[ "$BUILD_EL2" == "true" ]]; then
            rpm_files+=(
              "$PACKAGE_RPMS_DIR/$(jq -r '.kernels.el2.packages.kernel' "$manifest_path")"
              "$PACKAGE_RPMS_DIR/$(jq -r '.kernels.el2.packages.kernel_modules' "$manifest_path")"
            )
          fi

          # RPM 路径不含空白，容器内靠分词展开
          sudo docker run --rm \
            --env ROOTFS_DIR="$ROOTFS_DIR" \
            --env FEDORA_RELEASE="$FEDORA_RELEASE" \
            --env RPM_FILES="${rpm_files[*]}" \
            -v "$(dirname "$ROOTFS_DIR")":"$(dirname "$ROOTFS_DIR")" \
            -v "$PACKAGE_RPMS_DIR":"$PACKAGE_RPMS_DIR" \
            --user root \
            "fedora:${FEDORA_RELEASE}" \
            bash -euxo pipefail -c '
              # 腾出 gaokun 固件包的位置：先卸载发行版自带的 atheros/qcom 固件
              stock_firmware_packages=()
              rpm --root="$ROOTFS_DIR" -q atheros-firmware >/dev/null 2>&1 && stock_firmware_packages+=(atheros-firmware)
              rpm --root="$ROOTFS_DIR" -q qcom-firmware >/dev/null 2>&1 && stock_firmware_packages+=(qcom-firmware)
              if (( ${#stock_firmware_packages[@]} )); then
                rpm --root="$ROOTFS_DIR" -e --nodeps "${stock_firmware_packages[@]}"
              fi

              dnf -y --installroot="$ROOTFS_DIR" --releasever="$FEDORA_RELEASE" --use-host-config --nogpgcheck \
                install --allowerasing \
                $RPM_FILES
            '

          sudo depmod -b "$ROOTFS_DIR" -a "$kernel_release"
          if [[ "$BUILD_EL2" == "true" ]]; then
            sudo depmod -b "$ROOTFS_DIR" -a "$el2_kernel_release"
          fi

      - name: Slim rootfs (remove caches, logs, docs before imaging)
        run: |
          set -euxo pipefail
          sudo find "$ROOTFS_DIR/usr/share/doc" -type f \( -name '*.gz' -o -name 'changelog*' -o -name 'README*' -o -name 'LICENSE*' \) -delete 2>/dev/null || true
          sudo find "$ROOTFS_DIR/usr/share/man" -type f \( -name '*.gz' -o -name '*.bz2' -o -name '*.zst' \) -delete 2>/dev/null || true
          sudo rm -rf "$ROOTFS_DIR/var/log/journal"
          # 只清空内容、保留目录本身与权限位：后续 chroot 步骤、镜像内运行时都依赖 /tmp、/var/tmp、/var/cache
          sudo find "$ROOTFS_DIR/tmp" "$ROOTFS_DIR/var/tmp" "$ROOTFS_DIR/var/cache" -mindepth 1 -delete 2>/dev/null || true
          sudo du -sh "$ROOTFS_DIR"

      - name: Compute image size from rootfs usage
        run: |
          set -euxo pipefail
          used_kib="$(sudo du -sk "$ROOTFS_DIR" | cut -f1)"
          # rootfs 用量 + btrfs 元数据余量 15% + 2GiB 冗余 + 1GiB ESP，向上取整到 GiB，下限 8G
          want_gib=$(( (used_kib / 10 * 3 / 2 + used_kib) * 1024 + 3 * 1024 * 1024 * 1024 ) / (1024 * 1024 * 1024) )
          if (( want_gib < 8 )); then
            want_gib=8
          fi
          echo "IMAGE_SIZE=${want_gib}G" >> "$GITHUB_ENV"
          echo "image size: ${want_gib}G (rootfs usage: $(( used_kib / 1024 ))MiB)"

      - name: Create disk image and configure boot
        run: scripts/ci/50_make_image_fedora.sh

      # 输出 tag_name / kernel_release / package_glob 到 GITHUB_OUTPUT
      - name: Package image and generate release info
        id: package
        run: scripts/ci/60_package_release_fedora.sh

      - name: Upload build artifacts (workflow)
        uses: actions/upload-artifact@v6
        with:
          name: fedora-gaokun3-build
          compression-level: 0 # .zst 已是压缩数据，跳过 zip 打包的重复压缩
          path: ${{ env.ARTIFACT_DIR }}/${{ steps.package.outputs.package_glob }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: Fedora ${{ env.FEDORA_RELEASE }} - gaokun3 - ${{ steps.package.outputs.kernel_release }}
          body_path: ${{ env.ARTIFACT_DIR }}/release-body.md
          files: ${{ env.ARTIFACT_DIR }}/${{ steps.package.outputs.package_glob }}
