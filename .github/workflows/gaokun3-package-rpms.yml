name: Build Package - RPMs Gaokun3

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: Linux kernel tag
        required: true
        default: "v7.2.5"
      build_el2:
        description: Build extra -gaokun3-el2 kernel packages
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      kernel_tag:
        description: Linux kernel tag
        required: true
        type: string
      build_el2:
        description: Build extra -gaokun3-el2 kernel packages
        required: false
        default: false
        type: boolean
    outputs:
      package_release_tag:
        description: Release tag containing the generated package bundle
        value: ${{ jobs.build-package-rpms.outputs.package_release_tag }}

permissions:
  contents: write

# 同一分支/标签上的重跑只排队不互相取消：内核/包构建是长任务。
# 组名用固定字面量而非 github.workflow：本工作流可被 fedora-gaokun3-release
# 通过 workflow_call 调用，此时 github.workflow 是调用方的名字（曾因此与顶层
# 工作流撞组，触发 concurrency deadlock 被取消）
concurrency:
  group: gaokun3-package-rpms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package-rpms:
    outputs:
      package_release_tag: ${{ steps.release_meta.outputs.package_release_tag }}
    runs-on: ubuntu-24.04-arm
    env:
      TZ: UTC
      KERNEL_TAG: ${{ inputs.kernel_tag || github.event.inputs.kernel_tag }}
      BUILD_EL2: ${{ inputs.build_el2 || github.event.inputs.build_el2 || 'false' }}
      GAOKUN_DIR: ${{ github.workspace }}
      WORKDIR: ${{ github.workspace }}/build-packages
      KERN_SRC: ${{ github.workspace }}/build-packages/mainline-linux
      KERN_SRC_BASE: ${{ github.workspace }}/build-packages/mainline-linux-base
      KERN_OUT: ${{ github.workspace }}/build-packages/kernel-out
      KERN_SRC_EL2: ${{ github.workspace }}/build-packages/mainline-linux
      KERN_OUT_EL2: ${{ github.workspace }}/build-packages/kernel-out-el2
      ARTIFACT_DIR: ${{ github.workspace }}/build-packages/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc bc bison flex cpio rsync kmod \
            libssl-dev libelf-dev dwarves ccache aria2 xz-utils

      - name: Download Linux source tarball
        run: |
          set -euxo pipefail
          kern_ver="${KERNEL_TAG#v}"
          mkdir -p build-packages/mainline-linux
          aria2c -x 4 -s 4 -d build-packages -o linux.tar.xz \
            "https://cdn.kernel.org/pub/linux/kernel/v${kern_ver%%.*}.x/linux-${kern_ver}.tar.xz" || \
          aria2c -x 4 -s 4 -d build-packages -o linux.tar.xz \
            "https://mirrors.edge.kernel.org/pub/linux/kernel/v${kern_ver%%.*}.x/linux-${kern_ver}.tar.xz"
          tar -xJf build-packages/linux.tar.xz -C build-packages/mainline-linux --strip-components=1
          cd build-packages/mainline-linux
          git init -q
          # 一次性仓库：禁用 gc。gc --auto 检测到大量松散对象后会在后台 repack/prune，
          # 与后续脚本对源码树的快照拷贝竞态（对象被中途删除导致 ENOENT）
          git config gc.auto 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git -c commit.gpgsign=false commit -q -m "Linux ${KERNEL_TAG} baseline"

      - name: Resolve package release tag
        id: release_meta
        run: |
          set -euxo pipefail
          safe_kernel_tag="${KERNEL_TAG//\//-}"
          safe_kernel_tag="${safe_kernel_tag//[^A-Za-z0-9._-]/-}"
          profile="std"
          if [[ "$BUILD_EL2" == "true" ]]; then
            profile="std-el2"
          fi
          package_release_tag="gaokun3-rpms-${safe_kernel_tag}-${profile}-$(date -u +%Y%m%d%H%M%S)"

          echo "package_release_tag=$package_release_tag" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_RELEASE_TAG=$package_release_tag" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: gaokun3-packages-rpm-ccache-${{ env.KERNEL_TAG }}-${{ env.BUILD_EL2 }}-${{ hashFiles('patches/**/*.patch', 'defconfig/**', 'dts/**', 'drivers/**', 'packaging/**', 'firmware/**', 'scripts/ci/*.sh', '.github/workflows/gaokun3-package-rpms.yml') }}
          restore-keys: |
            gaokun3-packages-rpm-ccache-${{ env.KERNEL_TAG }}-
            gaokun3-packages-rpm-ccache-

      - name: Build gaokun kernel variants
        run: |
          set -euxo pipefail
          mkdir -p "$WORKDIR" "$ARTIFACT_DIR"
          chmod +x scripts/ci/20_build_kernel_variants.sh
          scripts/ci/20_build_kernel_variants.sh

      - name: Build RPM packages
        run: |
          sudo docker run --rm \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e GAOKUN_DIR="$GAOKUN_DIR" \
            -e WORKDIR="$WORKDIR" \
            -e KERN_SRC="$KERN_SRC" \
            -e KERN_OUT="$KERN_OUT" \
            -e KERN_SRC_BASE="$KERN_SRC_BASE" \
            -e KERN_SRC_EL2="$KERN_SRC_EL2" \
            -e KERN_OUT_EL2="$KERN_OUT_EL2" \
            -e ARTIFACT_DIR="$ARTIFACT_DIR" \
            -e KERNEL_TAG="$KERNEL_TAG" \
            -e PACKAGE_RELEASE_TAG="$PACKAGE_RELEASE_TAG" \
            -e BUILD_EL2="$BUILD_EL2" \
            --user root \
            "fedora:44" \
            bash -euxo pipefail -c '
              dnf -y install gcc make rpm-build kmod elfutils-libelf-devel tar gzip rsync
              chmod +x scripts/ci/70_build_package_rpms.sh
              scripts/ci/70_build_package_rpms.sh
            '

      # 上传/发布阶段只读 ARTIFACT_DIR；内核树、构建输出与打包 staging 在此已无用。
      # 构建累计占用 15G+，ARM runner 磁盘紧张，不清理会导致后续步骤创建临时目录失败（ENOSPC）
      - name: Free disk space before uploads
        run: |
          set -euxo pipefail
          sudo rm -rf \
            "$KERN_SRC" "$KERN_SRC_BASE" "$KERN_OUT" "$KERN_OUT_EL2" \
            "$WORKDIR/rpmbuild" "$WORKDIR/package-buildroots" \
            "$WORKDIR/linux.tar.xz"
          df -h /

      - name: Upload build artifacts (workflow)
        uses: actions/upload-artifact@v6
        with:
          name: gaokun3-package-rpms
          compression-level: 0 # RPM 内部已是压缩数据，跳过 zip 二次压缩省临时盘与时间
          path: |
            ${{ env.ARTIFACT_DIR }}/*.rpm
            ${{ env.ARTIFACT_DIR }}/package-manifest.json
            ${{ env.ARTIFACT_DIR }}/package-release-body.md

      - name: Publish package release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ env.PACKAGE_RELEASE_TAG }}
          name: gaokun3 package RPMs - ${{ env.KERNEL_TAG }}${{ env.BUILD_EL2 == 'true' && ' + EL2' || '' }}
          body_path: ${{ env.ARTIFACT_DIR }}/package-release-body.md
          prerelease: false
          make_latest: false
          append_body: false
          overwrite_files: true
          files: |
            ${{ env.ARTIFACT_DIR }}/*.rpm
            ${{ env.ARTIFACT_DIR }}/package-manifest.json
