name: Build Package - DEBs Gaokun3

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: Linux kernel tag
        required: true
        default: "v7.2.5"
      build_el2:
        description: Build extra -gaokun3-el2 kernel packages
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      kernel_tag:
        description: Linux kernel tag
        required: true
        type: string
      build_el2:
        description: Build extra -gaokun3-el2 kernel packages
        required: false
        default: false
        type: boolean
    outputs:
      package_release_tag:
        description: Release tag containing the generated package bundle
        value: ${{ jobs.build-package-debs.outputs.package_release_tag }}

permissions:
  contents: write

jobs:
  build-package-debs:
    outputs:
      package_release_tag: ${{ steps.release_meta.outputs.package_release_tag }}
    runs-on: ubuntu-24.04-arm
    env:
      TZ: UTC
      KERNEL_TAG: ${{ inputs.kernel_tag || github.event.inputs.kernel_tag }}
      BUILD_EL2: ${{ inputs.build_el2 || github.event.inputs.build_el2 || 'false' }}
      GAOKUN_DIR: ${{ github.workspace }}
      WORKDIR: ${{ github.workspace }}/build-packages
      KERN_SRC: ${{ github.workspace }}/build-packages/mainline-linux
      KERN_SRC_BASE: ${{ github.workspace }}/build-packages/mainline-linux-base
      KERN_OUT: ${{ github.workspace }}/build-packages/kernel-out
      KERN_SRC_EL2: ${{ github.workspace }}/build-packages/mainline-linux
      KERN_OUT_EL2: ${{ github.workspace }}/build-packages/kernel-out-el2
      ARTIFACT_DIR: ${{ github.workspace }}/build-packages/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc bc bison flex cpio rsync kmod \
            libssl-dev libelf-dev dwarves ccache dpkg-dev aria2 xz-utils

      - name: Download Linux source tarball
        run: |
          set -euxo pipefail
          kern_ver="${KERNEL_TAG#v}"
          mkdir -p build-packages/mainline-linux
          aria2c -x 4 -s 4 -d build-packages -o linux.tar.xz \
            "https://cdn.kernel.org/pub/linux/kernel/v${kern_ver%%.*}.x/linux-${kern_ver}.tar.xz" || \
          aria2c -x 4 -s 4 -d build-packages -o linux.tar.xz \
            "https://mirrors.edge.kernel.org/pub/linux/kernel/v${kern_ver%%.*}.x/linux-${kern_ver}.tar.xz"
          tar -xJf build-packages/linux.tar.xz -C build-packages/mainline-linux --strip-components=1
          cd build-packages/mainline-linux
          git init -q
          # 一次性仓库：禁用 gc。gc --auto 检测到大量松散对象后会在后台 repack/prune，
          # 与后续脚本对源码树的快照拷贝竞态（对象被中途删除导致 ENOENT）
          git config gc.auto 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git -c commit.gpgsign=false commit -q -m "Linux ${KERNEL_TAG} baseline"

      - name: Resolve package release tag
        id: release_meta
        run: |
          set -euxo pipefail
          safe_kernel_tag="${KERNEL_TAG//\//-}"
          safe_kernel_tag="${safe_kernel_tag//[^A-Za-z0-9._-]/-}"
          profile="std"
          if [[ "$BUILD_EL2" == "true" ]]; then
            profile="std-el2"
          fi
          package_release_tag="gaokun3-debs-${safe_kernel_tag}-${profile}-$(date -u +%Y%m%d%H%M%S)"

          echo "package_release_tag=$package_release_tag" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_RELEASE_TAG=$package_release_tag" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: gaokun3-packages-deb-ccache-${{ env.KERNEL_TAG }}-${{ env.BUILD_EL2 }}-${{ hashFiles('patches/**/*.patch', 'defconfig/**', 'dts/**', 'drivers/**', 'packaging/**', 'firmware/**', 'scripts/ci/*.sh', '.github/workflows/gaokun3-package-debs.yml') }}
          restore-keys: |
            gaokun3-packages-deb-ccache-${{ env.KERNEL_TAG }}-
            gaokun3-packages-deb-ccache-

      - name: Build gaokun kernel variants
        run: |
          set -euxo pipefail
          mkdir -p "$WORKDIR" "$ARTIFACT_DIR"
          chmod +x scripts/ci/20_build_kernel_variants.sh
          scripts/ci/20_build_kernel_variants.sh

      - name: Build DEB packages
        run: |
          chmod +x scripts/ci/70_build_package_debs.sh
          scripts/ci/70_build_package_debs.sh

      # 上传/发布阶段只读 ARTIFACT_DIR；内核树、构建输出与打包 staging 在此已无用。
      # 构建累计占用 15G+，ARM runner 磁盘紧张，不清理会导致后续步骤创建临时目录失败（ENOSPC）
      - name: Free disk space before uploads
        run: |
          set -euxo pipefail
          sudo rm -rf \
            "$KERN_SRC" "$KERN_SRC_BASE" "$KERN_OUT" "$KERN_OUT_EL2" \
            "$WORKDIR/debbuild" "$WORKDIR/package-buildroots" \
            "$WORKDIR/linux.tar.xz"
          df -h /

      - name: Upload build artifacts (workflow)
        uses: actions/upload-artifact@v6
        with:
          name: gaokun3-package-debs
          compression-level: 0 # DEB 内部已是 xz/zstd 压缩数据，跳过 zip 二次压缩省临时盘与时间
          path: |
            ${{ env.ARTIFACT_DIR }}/*.deb
            ${{ env.ARTIFACT_DIR }}/package-manifest.json
            ${{ env.ARTIFACT_DIR }}/package-release-body.md

      - name: Publish package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          release_name="gaokun3 package DEBs - ${KERNEL_TAG}"
          if [[ "${BUILD_EL2}" == "true" ]]; then
            release_name="${release_name} + EL2"
          fi
          # 先创建不带资产的 release，绕开新建 release 期间发并发上传导致的 "Error saving asset"
          gh release create "$PACKAGE_RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "$release_name" \
            --notes-file "${ARTIFACT_DIR}/package-release-body.md" \
            --latest=false
          # release 已建好，此处并发上传各资产。
          # 单文件限时 30 分钟防挂死；上传端点偶发 HTTP 500，--clobber 幂等，失败自动重试 3 次
          pids=()
          for f in "${ARTIFACT_DIR}"/*.deb "${ARTIFACT_DIR}/package-manifest.json"; do
            (
              for attempt in 1 2 3; do
                if timeout 1800 gh release upload "$PACKAGE_RELEASE_TAG" "$f" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --clobber; then
                  exit 0
                fi
                echo "upload of $(basename "$f") failed on attempt $attempt/3" >&2
                sleep $((attempt * 15))
              done
              exit 1
            ) &
            pids+=($!)
          done
          rc=0
          for p in "${pids[@]}"; do wait "$p" || rc=1; done
          [[ $rc -eq 0 ]] || { echo "some release assets failed to upload" >&2; exit 1; }
