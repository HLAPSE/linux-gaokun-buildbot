# gaokun3: 本内核未启用 CONFIG_SND_SEQUENCER，snd-seq / snd-ioctl32 不存在。
# Ubuntu 的 alsa-base.conf 给 snd 挂了 install 钩子，其中 `modprobe --quiet --use-blacklist snd-seq`
# 会因模块缺失返回非 0，使钩子整体失败，连带 snd 及其依赖（snd-soc-sc8280xp 等）
# 在启动阶段加载失败（systemd-modules-load.service 报 FAILURE）。
# 这里用文件名更靠前的同名 install 覆盖掉它以补齐 `|| true`（modprobe 取首个匹配的 install 定义）；
# 若后续内核打开 CONFIG_SND_SEQUENCER，本文件可以直接删除。
install snd /sbin/modprobe --ignore-install snd $CMDLINE_OPTS && { /sbin/modprobe --quiet --use-blacklist snd-ioctl32 || true ; /sbin/modprobe --quiet --use-blacklist snd-seq || true ; }