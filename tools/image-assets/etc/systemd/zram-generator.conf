# gaokun3: zram swap（内核 CONFIG_ZRAM=m）
# Live USB 场景下磁盘 swap 不可用，zram 是唯一 swap；
# 上限 4G，避免大内存设备压缩占用过高
[zram0]
zram-size = min(ram / 2, 4096)
# 只能选内核 zram 实际编进的后端（看 /sys/block/zram0/comp_algorithm）：
# 当前 gaokun3 内核只有 lzo-rle/lzo（CONFIG_ZRAM_BACKEND_ZSTD 未开），写 zstd 会被 zram-generator 拒绝并退回默认
compression-algorithm = lzo-rle
swap-priority = 100
fs-type = swap
